[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-rag-framework"
version = "0.1.0"
description = "Modular Audio RAG experimental framework for knowledge poisoning research."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "librosa>=0.10",
  "faiss-cpu>=1.8.0",
  "pyyaml>=6.0.1",
  "tqdm>=4.66",
  "pandas>=2.2",
  "torch>=2.2",
  "torchaudio>=2.2",
  "transformers>=4.45",
  "openai>=1.40.0",
  "google-generativeai>=0.8.0",
  "scikit-learn>=1.5",
  "python-dotenv>=1.0.1",
  "panns-inference>=0.1.1",
  "sentence-transformers>=3.0.1",
]

[tool.setuptools]
packages = [
  "dataset",
  "retriever",
  "rag",
  "models",
  "attack",
  "evaluation",
  "utils",
]
